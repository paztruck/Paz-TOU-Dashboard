homeassistant:
  name: Home Assistant
  latitude: 0.0
  longitude: 0.0
  elevation: 0
  unit_system: metric
  currency: USD
  country: US
  time_zone: America/Los_Angeles
  customize: !include customize.yaml

# Load packages
packages: !include_dir_named packages

# Automation rules
automation: !include automations.yaml

# Scripts
script: !include scripts.yaml

lovelace:
  dashboards:
    tou-bill-check:
      mode: yaml
      filename: tou-dashboard.yaml
      title: SDG&E TOU
      icon: mdi:cash-check
      show_in_sidebar: true