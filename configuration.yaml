http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

homeassistant:
  name: Home Assistant
  latitude: 0.0
  longitude: 0.0
  elevation: 0
  unit_system: metric
  currency: USD
  country: US
  time_zone: America/Los_Angeles
  customize: !include customize.yaml
  packages: !include_dir_named packages

# Loads default set of integrations (energy dashboard, recorder, statistics, etc.)
default_config:

# Automation rules
automation: !include automations.yaml

# Scripts
script: !include scripts.yaml

lovelace:
  dashboards:
    tou-bill-check:
      mode: yaml
      filename: tou-dashboard.yaml
      title: SDG&E TOU
      icon: mdi:cash-check
      show_in_sidebar: true
    tv-entertainment:
      mode: yaml
      filename: tv-entertainment-dashboard.yaml
      title: Household Quick View
      icon: mdi:home-outline
      show_in_sidebar: true