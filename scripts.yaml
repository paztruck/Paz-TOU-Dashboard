learn_ir_for_a_c:
  sequence: []
  alias: Learn IR for A/C
  description: ''

backfill_august_2026_trueup_import:
  alias: "Backfill August 2026 True-Up Import (SDG&E bill)"
  # One-time seed of the True-Up import meters; adds the August bill on top of what's already tracked, then delete this script.
  sequence:
    - service: utility_meter.calibrate
      target:
        entity_id: sensor.tou_imported_energy_trueup_on_peak
      data:
        value: "{{ (states('sensor.tou_imported_energy_trueup_on_peak') | float(0)) + 191 }}"
    - service: utility_meter.calibrate
      target:
        entity_id: sensor.tou_imported_energy_trueup_off_peak
      data:
        value: "{{ (states('sensor.tou_imported_energy_trueup_off_peak') | float(0)) + 114 }}"
    - service: utility_meter.calibrate
      target:
        entity_id: sensor.tou_imported_energy_trueup_super_off_peak
      data:
        value: "{{ (states('sensor.tou_imported_energy_trueup_super_off_peak') | float(0)) + 55 }}"
