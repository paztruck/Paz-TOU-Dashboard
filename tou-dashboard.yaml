title: SDG&E TOU Bill Check
views:
  - title: "📄 Monthly Statement Reconciliation"
    path: tou-monthly-statement
    cards:
      - type: entities
        title: Billing Period Dates
        entities:
          - entity: input_datetime.tou_billing_start
            name: Billing Start Date
          - entity: input_datetime.tou_billing_end
            name: Billing End Date
          - entity: sensor.tou_billing_period
            name: Statement Period
          - entity: sensor.tou_billing_cycle_length
            name: Current Cycle Length
          - entity: sensor.tou_estimated_next_billing_end
            name: Estimated Next Billing End
          - entity: input_button.tou_apply_billing_reset
            name: Apply new billing cycle (reset TOU meters)

      - type: markdown
        title: "TOU Billing Energy Breakdown (Monthly Statement)"
        content: |
          | TOU Period | Solar Produced (kWh) | Solar Consumed by House (kWh) | Solar onto Grid (kWh) | SDG&E Use / Imported (kWh) |
          | :--- | :---: | :---: | :---: | :---: |
          | **On-Peak** (4pm – 9pm) | {{ states('sensor.tou_solar_production_billing_cycle_on_peak') }} | {{ states('sensor.tou_solar_to_house_billing_cycle_on_peak') }} | {{ states('sensor.tou_exported_energy_billing_cycle_on_peak') }} | {{ states('sensor.tou_imported_energy_billing_cycle_on_peak') }} |
          | **Off-Peak** (6am–4pm & 9pm–12am) | {{ states('sensor.tou_solar_production_billing_cycle_off_peak') }} | {{ states('sensor.tou_solar_to_house_billing_cycle_off_peak') }} | {{ states('sensor.tou_exported_energy_billing_cycle_off_peak') }} | {{ states('sensor.tou_imported_energy_billing_cycle_off_peak') }} |
          | **Super Off-Peak** (12am–6am / 10am-2pm) | {{ states('sensor.tou_solar_production_billing_cycle_super_off_peak') }} | {{ states('sensor.tou_solar_to_house_billing_cycle_super_off_peak') }} | {{ states('sensor.tou_exported_energy_billing_cycle_super_off_peak') }} | {{ states('sensor.tou_imported_energy_billing_cycle_super_off_peak') }} |
          | **Total kWh** | **{{ states('sensor.tou_solar_production_billing_cycle') }}** | **{{ states('sensor.tou_solar_to_house_billing_cycle') }}** | **{{ states('sensor.tou_exported_energy_billing_cycle') }}** | **{{ states('sensor.tou_imported_energy_billing_cycle') }}** |

      - type: entities
        title: Monthly Statement Totals & Cost Reconciliation
        entities:
          - entity: sensor.tou_imported_energy_billing_cycle
            name: Power Consumed from Grid by Home (SDG&E Use)
            icon: mdi:transmission-tower-import
          - entity: sensor.tou_import_cost_billing_cycle
            name: Estimated Monthly Grid Import Cost ($)
            icon: mdi:currency-usd
          - entity: sensor.tou_solar_production_billing_cycle
            name: Solar Production
            icon: mdi:solar-power
          - entity: sensor.tou_solar_to_house_billing_cycle
            name: Solar Consumed by Home
            icon: mdi:home-solar
          - entity: sensor.tou_solar_self_consumption_savings_billing_cycle
            name: Self-Consumption Dollar Savings ($)
            icon: mdi:piggy-bank
          - entity: sensor.tou_exported_energy_billing_cycle
            name: Solar onto Grid for SDG&E Profit / Credit
            icon: mdi:transmission-tower-export
          - entity: sensor.tou_solar_export_credit_billing_cycle
            name: Grid Export Credit ($)
            icon: mdi:cash-plus
          - entity: sensor.tou_total_solar_savings_billing_cycle
            name: Total Monthly Solar Savings ($)
            icon: mdi:cash-multiple
          - entity: sensor.tou_house_energy_billing_cycle
            name: Total Electrical kWh Used (Home Total)
            icon: mdi:lightning-bolt

      - type: entities
        title: Statement Charges Breakdown Rates
        entities:
          - entity: input_number.sdge_delivery_rate
            name: Elect Delivery Rate ($/kWh)
          - entity: input_number.sdge_nbc_rate
            name: Non-Bypassable Charge (NBC) Rate ($/kWh)
          - entity: sensor.tou_non_bypassable_charges_billing_cycle
            name: Non-Bypassable Charges (NBC) Total ($)
            icon: mdi:file-percent
          - entity: input_number.sdge_generation_on_peak
            name: On-Peak Generation Rate ($/kWh)
          - entity: input_number.sdge_generation_off_peak
            name: Off-Peak Generation Rate ($/kWh)
          - entity: input_number.sdge_generation_super_off_peak
            name: Super Off-Peak Generation Rate ($/kWh)
          - entity: sensor.tou_import_cost_today
            name: Estimated Import Cost Today

  - title: "💵 TOU Daily Check"
    path: tou-bill-check
    cards:
      - type: entities
        title: Current TOU period and rate
        entities:
          - entity: sensor.tou_period
            name: Current period
          - entity: sensor.sdg_e_delivery_rate
            name: Delivery rate
          - entity: sensor.sdg_e_generation_rate
            name: Generation rate
          - entity: sensor.sdg_e_total_import_rate
            name: Total import rate

      - type: entities
        title: Billing period
        entities:
          - entity: input_datetime.tou_billing_start
            name: Billing start
          - entity: input_datetime.tou_billing_end
            name: Billing end
          - entity: sensor.tou_billing_period
            name: Selected period
          - entity: sensor.tou_billing_cycle_length
            name: Cycle length
          - entity: sensor.tou_estimated_next_billing_end
            name: Estimated next billing end

      - type: entities
        title: TOU rate schedule
        entities:
          - entity: input_number.sdge_generation_on_peak
            name: On-peak generation rate
          - entity: input_number.sdge_generation_off_peak
            name: Off-peak generation rate
          - entity: input_number.sdge_generation_super_off_peak
            name: Super off-peak generation rate
          - entity: sensor.sdg_e_delivery_rate
            name: Delivery rate

      - type: grid
        title: Imported energy today by TOU period
        columns: 2
        square: false
        cards:
          - type: entity
            entity: sensor.tou_imported_energy_daily_on_peak
            name: On-peak import
            icon: mdi:transmission-tower-import
          - type: entity
            entity: sensor.tou_imported_energy_daily_off_peak
            name: Off-peak import
            icon: mdi:transmission-tower-import
          - type: entity
            entity: sensor.tou_imported_energy_daily_super_off_peak
            name: Super off-peak import
            icon: mdi:transmission-tower-import
          - type: entity
            entity: sensor.tou_imported_energy_today
            name: Total imported energy
            icon: mdi:transmission-tower-import

      - type: grid
        title: Solar production today by TOU period
        columns: 2
        square: false
        cards:
          - type: entity
            entity: sensor.tou_solar_production_daily_on_peak
            name: On-peak solar
            icon: mdi:solar-power
          - type: entity
            entity: sensor.tou_solar_production_daily_off_peak
            name: Off-peak solar
            icon: mdi:solar-power
          - type: entity
            entity: sensor.tou_solar_production_daily_super_off_peak
            name: Super off-peak solar
            icon: mdi:solar-power
          - type: entity
            entity: sensor.tou_solar_production_today
            name: Total solar production
            icon: mdi:solar-power

      - type: entities
        title: Daily estimate
        entities:
          - entity: sensor.tou_import_cost_today
            name: Estimated import cost today
          - entity: sensor.tou_solar_self_consumption_savings_today
            name: Self-consumption savings today
            icon: mdi:piggy-bank
          - entity: sensor.tou_solar_export_credit_today
            name: Grid export credit today
            icon: mdi:cash-plus
          - entity: sensor.tou_total_solar_savings_today
            name: Total solar savings today
            icon: mdi:cash-multiple
          - entity: sensor.tou_net_cost_today
            name: Net cost to date (today)
            icon: mdi:cash-sync
          - entity: sensor.tou_net_cost_billing_cycle
            name: Net cost to date (this billing cycle)
            icon: mdi:cash-sync
          - entity: sensor.solar_exported_power_daily
            name: Exported energy today
          - entity: sensor.solar_panel_production_daily
            name: Solar production today
          - entity: sensor.solar_lifetime_production
            name: Lifetime production

      - type: entities
        title: Lifetime production history
        entities:
          - entity: sensor.solar_original_inverter_lifetime_production
            name: Original inverter (retired, frozen total)
            icon: mdi:solar-power-variant-outline
          - entity: sensor.solar_current_inverter_lifetime_production
            name: Current inverter (Home Hub, live total)
            icon: mdi:solar-power-variant
          - entity: sensor.solar_lifetime_production
            name: Combined lifetime production
            icon: mdi:solar-power

      - type: entities
        title: Dedicated TOU meters today
        entities:
          - entity: sensor.tou_imported_energy_daily_on_peak
            name: Imported on-peak
          - entity: sensor.tou_imported_energy_daily_off_peak
            name: Imported off-peak
          - entity: sensor.tou_imported_energy_daily_super_off_peak
            name: Imported super off-peak
          - entity: sensor.tou_solar_production_daily_on_peak
            name: Solar production on-peak
          - entity: sensor.tou_solar_production_daily_off_peak
            name: Solar production off-peak
          - entity: sensor.tou_solar_production_daily_super_off_peak
            name: Solar production super off-peak
          - entity: sensor.tou_exported_energy_daily_on_peak
            name: Exported on-peak
          - entity: sensor.tou_exported_energy_daily_off_peak
            name: Exported off-peak
          - entity: sensor.tou_exported_energy_daily_super_off_peak
            name: Exported super off-peak
          - entity: sensor.tou_house_energy_daily_on_peak
            name: House use on-peak
          - entity: sensor.tou_house_energy_daily_off_peak
            name: House use off-peak
          - entity: sensor.tou_house_energy_daily_super_off_peak
            name: House use super off-peak

      - type: grid
        title: Peak collections today
        columns: 1
        square: false
        cards:
          - type: entities
            title: On-peak
            entities:
              - entity: sensor.tou_imported_energy_daily_on_peak
                name: Grid import
              - entity: sensor.tou_house_energy_daily_on_peak
                name: Estimated house consumption
          - type: entities
            title: Off-peak
            entities:
              - entity: sensor.tou_imported_energy_daily_off_peak
                name: Grid import
              - entity: sensor.tou_house_energy_daily_off_peak
                name: Estimated house consumption
          - type: entities
            title: Super off-peak
            entities:
              - entity: sensor.tou_imported_energy_daily_super_off_peak
                name: Grid import
              - entity: sensor.tou_house_energy_daily_super_off_peak
                name: Estimated house consumption

      - type: entities
        title: Reduce Your Use Day
        entities:
          - type: section
            label: Live event tracking (4–9pm on event days)
          - entity: input_boolean.sdge_reduce_use_event_active
            name: Event today (turn ON in the morning)
          - entity: select.tou_imported_energy_reduce_use_event
            name: Meter mode (normal / event)
          - entity: sensor.sdg_e_reduce_your_use_tracked_kwh
            name: Event kWh this cycle (tracked)
            icon: mdi:flash-alert
          - entity: sensor.sdg_e_reduce_your_use_tracked_charge
            name: Surcharge so far (tracked)
            icon: mdi:cash-minus
          - type: section
            label: Bill reconciliation
          - entity: input_number.sdge_reduce_use_event_kwh
            name: Event kWh on bill
          - entity: input_number.sdge_reduce_use_billed_rate
            name: Billed event rate
          - entity: sensor.sdg_e_reduce_your_use_calculated_charge
            name: Calculated event charge
          - entity: input_number.sdge_reduce_use_actual_charge
            name: Actual bill charge
          - entity: sensor.sdg_e_reduce_your_use_charge_variance
            name: Charge variance
      - type: markdown
        content: >-
          This page estimates today's import cost from the available peak,
          off-peak, and super off-peak utility meters. Compare this estimate
          with the SDG&E bill.

  - title: "🗓️ Annual True-Up"
    path: tou-annual-trueup
    cards:
      - type: markdown
        content: >-
          SDG&E's annual true-up cycle runs August 1st through July 31st.
          These totals accumulate all year and automatically reset on
          August 1st.

      - type: markdown
        title: "True-Up Energy Breakdown (Year to Date)"
        content: |
          | TOU Period | Solar Produced (kWh) | Solar Consumed by House (kWh) | Solar onto Grid (kWh) | SDG&E Use / Imported (kWh) |
          | :--- | :---: | :---: | :---: | :---: |
          | **On-Peak** | {{ states('sensor.tou_solar_production_trueup_on_peak') }} | {{ states('sensor.tou_solar_to_house_trueup_on_peak') }} | {{ states('sensor.tou_exported_energy_trueup_on_peak') }} | {{ states('sensor.tou_imported_energy_trueup_on_peak') }} |
          | **Off-Peak** | {{ states('sensor.tou_solar_production_trueup_off_peak') }} | {{ states('sensor.tou_solar_to_house_trueup_off_peak') }} | {{ states('sensor.tou_exported_energy_trueup_off_peak') }} | {{ states('sensor.tou_imported_energy_trueup_off_peak') }} |
          | **Super Off-Peak** | {{ states('sensor.tou_solar_production_trueup_super_off_peak') }} | {{ states('sensor.tou_solar_to_house_trueup_super_off_peak') }} | {{ states('sensor.tou_exported_energy_trueup_super_off_peak') }} | {{ states('sensor.tou_imported_energy_trueup_super_off_peak') }} |
          | **Total kWh** | **{{ states('sensor.tou_solar_production_trueup') }}** | **{{ states('sensor.tou_solar_to_house_trueup') }}** | **{{ states('sensor.tou_exported_energy_trueup') }}** | **{{ states('sensor.tou_imported_energy_trueup') }}** |

      - type: entities
        title: True-up totals & cost reconciliation
        entities:
          - entity: sensor.tou_imported_energy_trueup
            name: Power Consumed from Grid (SDG&E Use)
            icon: mdi:transmission-tower-import
          - entity: sensor.tou_import_cost_trueup
            name: Estimated Annual Grid Import Cost ($)
            icon: mdi:currency-usd
          - entity: sensor.tou_non_bypassable_charges_trueup
            name: Non-Bypassable Charges (NBC) Total ($)
            icon: mdi:file-percent
          - entity: sensor.tou_solar_production_trueup
            name: Solar Production
            icon: mdi:solar-power
          - entity: sensor.tou_solar_to_house_trueup
            name: Solar Consumed by Home
            icon: mdi:home-solar
          - entity: sensor.tou_solar_self_consumption_savings_trueup
            name: Self-Consumption Dollar Savings ($)
            icon: mdi:piggy-bank
          - entity: sensor.tou_exported_energy_trueup
            name: Solar onto Grid for SDG&E Profit / Credit
            icon: mdi:transmission-tower-export
          - entity: sensor.tou_solar_export_credit_trueup
            name: Grid Export Credit ($)
            icon: mdi:cash-plus
          - entity: sensor.tou_total_solar_savings_trueup
            name: Total Annual Solar Savings ($)
            icon: mdi:cash-multiple
          - entity: sensor.tou_net_cost_trueup
            name: Net cost to date (this true-up year)
            icon: mdi:cash-sync
          - entity: sensor.tou_house_energy_trueup
            name: Total Electrical kWh Used (Home Total)
            icon: mdi:lightning-bolt

      - type: markdown
        title: "True-Up Year-over-Year Comparison"
        content: |
          | Cycle | Imported (kWh) | House Use (kWh) | Solar Produced (kWh) | Exported (kWh) | Solar to House (kWh) |
          | :--- | :---: | :---: | :---: | :---: | :---: |
          | **2026** | {{ states('input_number.trueup_archive_2026_imported_energy') }} | {{ states('input_number.trueup_archive_2026_house_energy') }} | {{ states('input_number.trueup_archive_2026_solar_production') }} | {{ states('input_number.trueup_archive_2026_exported_energy') }} | {{ states('input_number.trueup_archive_2026_solar_to_house') }} |
          | **2027** | {{ states('input_number.trueup_archive_2027_imported_energy') }} | {{ states('input_number.trueup_archive_2027_house_energy') }} | {{ states('input_number.trueup_archive_2027_solar_production') }} | {{ states('input_number.trueup_archive_2027_exported_energy') }} | {{ states('input_number.trueup_archive_2027_solar_to_house') }} |
          | **Current** | {{ states('sensor.tou_imported_energy_trueup') }} | {{ states('sensor.tou_house_energy_trueup') }} | {{ states('sensor.tou_solar_production_trueup') }} | {{ states('sensor.tou_exported_energy_trueup') }} | {{ states('sensor.tou_solar_to_house_trueup') }} |
