script:
  example_script:
    alias: "Example Script"
    sequence:
      - service: light.turn_on
        target:
          entity_id: light.living_room
      - delay: "00:00:05"
      - service: light.turn_off
        target:
          entity_id: light.living_room

  another_script:
    alias: "Another Script"
    sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.garage_door
      - delay: "00:00:10"
      - service: switch.turn_off
        target:
          entity_id: switch.garage_door