title: Household Quick View
views:
  - title: "🚘 Garage Quick View"
    path: Garage-quick-view
    cards:
      - type: custom:button-card
        entity: sensor.paz_garage_devices_garage_temp_sensor_garage_temp
        name: Garage Temperature
        icon: mdi:thermometer
        show_state: true
        show_icon: true
        styles:
          card:
            - width: 125%
            - min-width: 160px
            - min-height: 82px
            - margin: 0 auto
            - border-radius: 12px
            - padding: 6%
            - background: rgba(255,255,255,0.04)
          name:
            - font-size: 14px
          state:
            - color: red
            - font-size: 14px
            - font-weight: bold
          icon:
            - color: red
            - width: 20px
            - height: 20px

      - type: custom:button-card
        entity: sensor.paz_garage_man_cave_garage_humidity
        name: Garage Humidity
        icon: mdi:water-percent
        show_state: true
        show_icon: true
        styles:
          card:
            - width: 125%
            - min-width: 160px
            - min-height: 82px
            - margin: 0 auto
            - border-radius: 12px
            - padding: 6%
            - background: rgba(255,255,255,0.04)
          name:
            - font-size: 14px
          state:
            - color: blue
            - font-size: 14px
            - font-weight: bold
          icon:
            - color: blue
            - width: 20px
            - height: 20px

      - type: entities
        title: Current Power Used
        entities:
          - entity: sensor.paz_workbench_power
            name: WorkBench Power Used
            icon: mdi:bench-back
          - entity: sensor.paz_garage_freezer_power
            name:  Garage Freezer Power Used
            icon: mdi:fridge
          - entity: sensor.third_reality_inc_3rsp02064z_power_3
            name: Communications Stack Power Used
            icon: mdi:router-network
          - entity: sensor.paz_garage_devices_washing_machine_power
            name: Washing Machine Power Used
            icon: mdi:washing-machine

      - type: history-graph
        title: Room power history
        hours_to_show: 24
        entities:
          - entity: sensor.paz_workbench_power
            name: Paz-WorkBench Power Used
          - entity: sensor.paz_garage_freezer_power
            name: Garage Freezer Power Used
          - entity: sensor.third_reality_inc_3rsp02064z_power_3
            name: Communications Stack Power Used
          - entity: sensor.paz_garage_devices_washing_machine_power
            name: Washing Machine Power Used


      - type: entities
        title: Energy delivered
        entities:
          - entity: sensor.paz_workbench_summation_delivered
            name:  WorkBench Energy Delivered
            icon: mdi:bench-back
          - entity: sensor.paz_garage_freezer_summation_delivered
            name: Garage Freezer Energy Delivered
            icon: mdi:fridge
          - entity: sensor.third_reality_inc_3rsp02064z_summation_delivered_3
            name:  Communications Stack Energy Delivered
            icon: mdi:router-network
          - entity: sensor.paz_garage_devices_washing_machine
            Name: Washing Machine Enerty Delivered
            icon: mdi:washing-machine

